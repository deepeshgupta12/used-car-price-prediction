services:
  ucpp-api:
    build: .
    container_name: ucpp-api
    ports:
      - "8000:8000"
    environment:
      - UCPP_ARTIFACTS_DIR=/app/artifacts
      - UCPP_HOST=0.0.0.0
      - UCPP_PORT=8000
    volumes:
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready').read()\""]
      interval: 10s
      timeout: 3s
      retries: 10