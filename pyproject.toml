[project]
name = "ucpp"
version = "0.0.1"
description = "Used Car Price Prediction (two-market: IN + US) - local-first"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",

  # model runtimes (needed to load + run artifacts)
  "lightgbm>=4.5.0",
  "catboost>=1.2.7",

  # serving
  "fastapi>=0.110.0",
  "uvicorn>=0.30.0",

  # existing (ok to keep)
  "polars>=1.0.0",
  "pyarrow>=16.0.0",
  "duckdb>=1.0.0",
  "openpyxl>=3.1.2",
  "pydantic>=2.6.0",
  "pandera>=0.19.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
  "httpx>=0.28.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true