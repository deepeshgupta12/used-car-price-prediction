name: CI

on:
  push:
    branches:
      - main
      - v1-*
      - v2-*
      - v3-*
      - v4-*
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (pip)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check (ruff)
        run: |
          ruff format --check .
          ruff check .

      - name: Pytest
        run: |
          pytest -q